name: Screenshot smoke test

on:
  push:
    branches:
      - ops/screenshot-smoke
    paths:
      - .github/workflows/screenshot-smoke.yml

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Clean install and build
        run: |
          rm -rf node_modules apps/city/node_modules apps/office/node_modules package-lock.json
          npm install --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Start production preview
        run: |
          nohup npm run serve >/tmp/metrobsidian-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5190/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fIsS http://127.0.0.1:5190/ | head
          curl -fIsS http://127.0.0.1:5190/office.html | head

      - name: Capture real browser screenshot
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          echo "Using $CHROME"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --use-gl=angle \
            --use-angle=swiftshader \
            --window-size=1440,1000 \
            --virtual-time-budget=9000 \
            --screenshot=metrobsidian-city.png \
            http://127.0.0.1:5190/
          test -s metrobsidian-city.png
          file metrobsidian-city.png

      - name: Fix main lockfile
        run: |
          cp package-lock.json /tmp/package-lock.json
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/package-lock.json package-lock.json
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: regenerate workspace lockfile"
            git push origin HEAD:main
          fi

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: metrobsidian-city-screenshot
          path: metrobsidian-city.png
          if-no-files-found: error
          retention-days: 1
