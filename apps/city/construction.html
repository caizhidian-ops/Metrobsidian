<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <title>施工工地 · 记忆城市</title>
  </head>
  <body>
    <main id="construction-scene" aria-label="可交互的施工工地 3D 场景">
      <header class="site-topbar">
        <a href="./" class="back-link" aria-label="返回记忆城市">← 返回城市</a>
        <div><span>W-06</span><strong>施工工地</strong></div>
      </header>

      <aside class="site-panel" aria-label="工地区域">
        <span class="eyebrow">ACTIVE SITE 06</span>
        <h1>在建设想</h1>
        <p>1 份未完成文档，拆成 5 个待验证施工节点。</p>
        <div id="construction-document-shortcuts" class="document-shortcuts" aria-label="工地文档"></div>
        <ol class="stage-list" aria-label="创意 Agent 五阶段">
          <li><span>01</span>需求 Brief</li>
          <li><span>02</span>候选比较</li>
          <li><span>03</span>负面修复</li>
          <li><span>04</span>常规检查</li>
          <li><span>05</span>可编辑交付</li>
        </ol>
      </aside>

      <div id="construction-document-tooltip" class="document-tooltip" role="status" hidden>
        <strong id="construction-tooltip-title"></strong>
        <span id="construction-tooltip-status"></span>
      </div>

      <nav class="site-views" aria-label="工地视角">
        <button type="button" data-view="overview" aria-pressed="true">全景</button>
        <button type="button" data-view="structure" aria-pressed="false">结构区</button>
        <button type="button" data-view="equipment" aria-pressed="false">设备区</button>
        <button type="button" data-view="inspection" aria-pressed="false">验收区</button>
        <button id="reset-site" type="button" aria-label="重置工地视角">↺</button>
      </nav>

      <p class="site-hint">悬停查看 · 点击阅读 · 拖拽旋转 · 双击复位</p>
      <section id="construction-webgl-fallback" hidden>
        <h1>无法加载施工场景</h1>
        <p>当前浏览器未启用 WebGL。</p>
      </section>
    </main>

    <dialog id="construction-document-dialog" aria-labelledby="construction-reader-title">
      <article class="document-reader">
        <header>
          <div><span id="construction-reader-meta"></span><h2 id="construction-reader-title"></h2></div>
          <button id="close-construction-reader" type="button" aria-label="关闭文档">×</button>
        </header>
        <div id="construction-reader-body" class="document-reader__body"></div>
      </article>
    </dialog>
    <script type="module" src="/src/construction/main.ts"></script>
  </body>
</html>
