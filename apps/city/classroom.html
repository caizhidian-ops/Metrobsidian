<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <title>学校内部 · 教室 · 记忆城市</title>
  </head>
  <body>
    <main id="classroom-scene" aria-label="可交互的学校教室内部 3D 空间">
      <header class="room-topbar">
        <a href="./" class="back-link" aria-label="返回记忆城市">← 返回城市</a>
        <div><span>S-03</span><strong>学校内部 · 教室</strong></div>
      </header>

      <aside class="room-panel" aria-label="教室组件">
        <span class="eyebrow">CLASSROOM 01</span>
        <h1>体素教室</h1>
        <p>讲台、书架与学生席被组织进同一间教室。</p>
        <ul>
          <li><i style="--swatch:#7a4a2a"></i>讲台区</li>
          <li><i style="--swatch:#e6a91c"></i>学生席</li>
          <li><i style="--swatch:#6b3f24"></i>阅读角</li>
          <li><i style="--swatch:#4a90e2"></i>课程屏</li>
        </ul>
      </aside>

      <nav class="room-views" aria-label="教室视角">
        <button type="button" data-view="overview" aria-pressed="true">全景</button>
        <button type="button" data-view="podium" aria-pressed="false">讲台区</button>
        <button type="button" data-view="students" aria-pressed="false">学生席</button>
        <button id="reset-room" type="button" aria-label="重置教室视角">↺</button>
      </nav>

      <p class="room-hint">拖拽旋转 · 滚轮缩放 · 双击复位</p>
      <section id="classroom-webgl-fallback" hidden>
        <h1>无法加载教室</h1>
        <p>当前浏览器未启用 WebGL。</p>
      </section>
    </main>
    <script type="module" src="/src/classroom/main.ts"></script>
  </body>
</html>
